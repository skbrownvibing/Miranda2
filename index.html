<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miranda2 – Message Inbox</title>
<style>
/* ── Reset ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  font-size: 14px;
  background: #f2f2f7;
  color: #1c1c1e;
  height: 100vh;
  overflow: hidden;
}

/* ── Tokens ─────────────────────────────────────────────────── */
:root {
  --blue:       #007aff;
  --green:      #34c759;
  --orange:     #ff9500;
  --red:        #ff3b30;
  --gray:       #8e8e93;
  --bg:         #f2f2f7;
  --surface:    #ffffff;
  --border:     #d1d1d6;
  --text:       #1c1c1e;
  --text2:      #636366;
  --text3:      #aeaeb2;
  --sidebar-w:  320px;
}

/* ── Drop screen ─────────────────────────────────────────────── */
#drop-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: var(--bg);
  transition: background .15s;
}
#drop-screen.drag-over { background: #e8f0fe; }
.drop-card {
  background: var(--surface);
  border: 2px dashed var(--border);
  border-radius: 20px;
  padding: 56px 64px;
  text-align: center;
  max-width: 440px;
  width: 90%;
  transition: border-color .15s;
}
#drop-screen.drag-over .drop-card { border-color: var(--blue); }
.drop-icon { font-size: 52px; margin-bottom: 16px; line-height: 1; }
.drop-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
.drop-card p  { color: var(--text2); line-height: 1.6; margin-bottom: 24px; }
.drop-card strong { color: var(--text); }
.btn-primary {
  display: inline-block;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 10px 22px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-primary:hover { opacity: .85; }
.drop-hint {
  margin-top: 20px;
  font-size: 12px;
  color: var(--text3);
  line-height: 1.5;
}
.drop-hint code {
  background: var(--bg);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 11px;
  color: var(--text2);
}
#drop-error {
  margin-top: 16px;
  color: var(--red);
  font-size: 13px;
  display: none;
}

/* ── App shell ───────────────────────────────────────────────── */
#app {
  display: none;
  flex-direction: column;
  height: 100vh;
}
#app.loaded { display: flex; }

/* ── Header ──────────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 56px;
}
.header-brand { font-size: 17px; font-weight: 700; white-space: nowrap; }
.header-stats {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  flex: 1;
}
.stat-chip {
  font-size: 12px;
  color: var(--text2);
  white-space: nowrap;
}
.stat-chip strong { color: var(--text); }
.stat-chip.urgent strong { color: var(--red); }
.search-wrap {
  position: relative;
  flex-shrink: 0;
}
.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gray);
  pointer-events: none;
}
#search {
  width: 200px;
  padding: 7px 10px 7px 32px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: border-color .15s, width .2s;
}
#search:focus { border-color: var(--blue); width: 240px; }
.btn-icon {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text2);
  flex-shrink: 0;
  transition: background .12s;
}
.btn-icon:hover { background: var(--bg); }

/* ── Body ────────────────────────────────────────────────────── */
#body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ─────────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow: hidden;
}

/* Category tabs */
.cat-tabs {
  display: flex;
  gap: 4px;
  padding: 10px 12px 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  flex-shrink: 0;
  padding: 5px 12px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: none;
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  cursor: pointer;
  transition: all .12s;
  white-space: nowrap;
}
.cat-tab:hover { border-color: var(--blue); color: var(--blue); }
.cat-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.cat-tab[data-cat="personal"].active  { background: var(--green);  border-color: var(--green);  }
.cat-tab[data-cat="delivery"].active  { background: var(--orange); border-color: var(--orange); }
.cat-tab[data-cat="spam"].active      { background: var(--red);    border-color: var(--red);    }

/* Sub-filters */
.sub-filters {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.toggle-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.toggle-label input[type=checkbox] { accent-color: var(--blue); cursor: pointer; }
#wait-filter {
  margin-left: auto;
  font-size: 12px;
  padding: 3px 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text2);
  cursor: pointer;
  outline: none;
}

/* Result count */
.list-meta {
  padding: 6px 14px;
  font-size: 11px;
  color: var(--text3);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

/* Conversation list */
#conv-list {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.conv-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--text3);
  font-size: 13px;
  line-height: 1.6;
}
.conv-item {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s;
  position: relative;
}
.conv-item:last-child { border-bottom: none; }
.conv-item:hover { background: var(--bg); }
.conv-item.selected { background: #e8f3ff; }

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  flex-shrink: 0;
  background: var(--blue);
}
.avatar.personal      { background: var(--green);  }
.avatar.delivery      { background: var(--orange); }
.avatar.spam          { background: var(--red);    }
.avatar.uncategorized { background: var(--gray);   }

.conv-body { flex: 1; min-width: 0; }
.conv-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 2px;
}
.conv-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.conv-time {
  font-size: 11px;
  color: var(--text3);
  white-space: nowrap;
  flex-shrink: 0;
}
.conv-preview {
  font-size: 12px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.conv-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 10px;
  text-transform: uppercase;
  letter-spacing: .3px;
  color: #fff;
}
.badge.personal      { background: var(--green);  }
.badge.delivery      { background: var(--orange); }
.badge.spam          { background: var(--red);    }
.badge.uncategorized { background: var(--gray);   }
.badge.override      { outline: 2px solid #000; outline-offset: -2px; }

.wait-chip {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 10px;
  color: #fff;
}
.wait-chip.ok       { background: var(--green);  }
.wait-chip.warn     { background: var(--orange); }
.wait-chip.danger   { background: #ff6b00;       }
.wait-chip.critical { background: var(--red);    }

/* ── Detail panel ────────────────────────────────────────────── */
#detail {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}
.detail-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  font-size: 14px;
  gap: 8px;
}
.detail-empty-icon { font-size: 40px; }

#detail-pane {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

/* Detail header */
.detail-header {
  padding: 16px 20px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.detail-name {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 2px;
}
.detail-phone {
  font-size: 13px;
  color: var(--text2);
  margin-bottom: 10px;
}
.detail-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.detail-cat-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 12px;
  color: #fff;
  cursor: default;
}
.btn-message {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 12px;
  border: 1.5px solid var(--blue);
  border-radius: 12px;
  color: var(--blue);
  background: none;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  transition: all .12s;
}
.btn-message:hover { background: var(--blue); color: #fff; }

/* Messages thread */
.messages-thread {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg-row {
  display: flex;
  flex-direction: column;
  max-width: 72%;
}
.msg-row.mine   { align-self: flex-end;   align-items: flex-end;   }
.msg-row.theirs { align-self: flex-start; align-items: flex-start; }
.bubble {
  padding: 9px 13px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.45;
  word-break: break-word;
}
.bubble.mine {
  background: var(--blue);
  color: #fff;
  border-bottom-right-radius: 5px;
}
.bubble.theirs {
  background: var(--surface);
  color: var(--text);
  border-bottom-left-radius: 5px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.bubble-time {
  font-size: 10px;
  color: var(--text3);
  margin-top: 3px;
  padding: 0 3px;
}
.thread-note {
  text-align: center;
  font-size: 12px;
  color: var(--text3);
  padding: 4px 0 8px;
}

/* Override section */
.override-section {
  padding: 12px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.override-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 8px;
}
.override-btns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.override-btn {
  font-size: 12px;
  font-weight: 500;
  padding: 5px 14px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: none;
  color: var(--text2);
  cursor: pointer;
  transition: all .12s;
}
.override-btn:hover { border-color: var(--blue); color: var(--blue); }
.override-btn.active-personal      { background: var(--green);  border-color: var(--green);  color: #fff; }
.override-btn.active-delivery      { background: var(--orange); border-color: var(--orange); color: #fff; }
.override-btn.active-spam          { background: var(--red);    border-color: var(--red);    color: #fff; }
.override-btn.active-uncategorized { background: var(--gray);   border-color: var(--gray);   color: #fff; }

/* ── Scrollbar ───────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- ── Drop screen ───────────────────────────────────────────── -->
<div id="drop-screen">
  <div class="drop-card">
    <div class="drop-icon">&#128229;</div>
    <h1>Miranda2</h1>
    <p>
      Drop your <strong>miranda2_messages.json</strong> here<br>
      to load your message inbox.
    </p>
    <button class="btn-primary" onclick="document.getElementById('file-input').click()">
      Choose file
    </button>
    <input type="file" id="file-input" accept=".json" style="display:none">
    <div class="drop-hint">
      Run <code>export.command</code> first to generate the JSON file.<br>
      All data stays local — nothing leaves your browser.
    </div>
    <div id="drop-error"></div>
  </div>
</div>

<!-- ── App ───────────────────────────────────────────────────── -->
<div id="app">

  <!-- Header -->
  <header>
    <span class="header-brand">Miranda2</span>
    <div class="header-stats" id="stats-bar"></div>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="6.5" cy="6.5" r="5"/><line x1="10.5" y1="10.5" x2="15" y2="15"/>
      </svg>
      <input type="text" id="search" placeholder="Search…" oninput="handleSearch(this.value)">
    </div>
    <button class="btn-icon" onclick="resetData()" title="Load new file">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5a5.5 5.5 0 0 1 3.89 1.61L14 6"/>
        <path d="M14 2v4h-4"/>
      </svg>
    </button>
  </header>

  <!-- Body -->
  <div id="body">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="cat-tabs" id="cat-tabs">
        <button class="cat-tab" data-cat="all"           onclick="setCategory('all')">All</button>
        <button class="cat-tab active" data-cat="personal"     onclick="setCategory('personal')">Personal</button>
        <button class="cat-tab" data-cat="delivery"     onclick="setCategory('delivery')">Delivery</button>
        <button class="cat-tab" data-cat="spam"         onclick="setCategory('spam')">Spam</button>
        <button class="cat-tab" data-cat="uncategorized" onclick="setCategory('uncategorized')">Other</button>
      </div>
      <div class="sub-filters">
        <label class="toggle-label">
          <input type="checkbox" id="unreplied-toggle" checked onchange="handleUnrepliedToggle(this.checked)">
          Unreplied only
        </label>
        <select id="wait-filter" onchange="handleWaitFilter(this.value)">
          <option value="">Any time</option>
          <option value="1">1h+</option>
          <option value="24">24h+</option>
          <option value="72">3 days+</option>
          <option value="168">7 days+</option>
        </select>
      </div>
      <div class="list-meta" id="list-meta"></div>
      <div id="conv-list"></div>
    </aside>

    <!-- Detail -->
    <main id="detail">
      <div class="detail-empty" id="detail-empty">
        <div class="detail-empty-icon">&#128172;</div>
        <div>Select a conversation</div>
      </div>
      <div id="detail-pane" style="display:none"></div>
    </main>

  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────

const S = {
  conversations: [],
  overrides: {},          // id → category
  selectedId: null,
  filter: {
    category: 'personal',
    unrepliedOnly: true,
    waitHours: 0,
    search: '',
  },
};

const OVERRIDE_KEY = 'miranda2_overrides_v1';

// ── Bootstrap ────────────────────────────────────────────────────────────────

function init() {
  try {
    const raw = localStorage.getItem(OVERRIDE_KEY);
    if (raw) S.overrides = JSON.parse(raw);
  } catch (_) {}

  // Drop / file input on drop screen
  const ds = document.getElementById('drop-screen');
  ds.addEventListener('dragover', e => { e.preventDefault(); ds.classList.add('drag-over'); });
  ds.addEventListener('dragleave', () => ds.classList.remove('drag-over'));
  ds.addEventListener('drop', e => {
    e.preventDefault();
    ds.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });
  document.getElementById('file-input').addEventListener('change', e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });
}

function loadFile(file) {
  const err = document.getElementById('drop-error');
  err.style.display = 'none';
  if (!file.name.endsWith('.json')) {
    showDropError('Please select a .json file.');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.conversations) throw new Error('Unexpected format — missing "conversations" key.');
      loadData(data);
    } catch (ex) {
      showDropError('Could not parse file: ' + ex.message);
    }
  };
  reader.readAsText(file);
}

function showDropError(msg) {
  const el = document.getElementById('drop-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function loadData(data) {
  S.conversations = data.conversations || [];
  S.selectedId = null;
  document.getElementById('drop-screen').style.display = 'none';
  document.getElementById('app').classList.add('loaded');
  renderAll();
}

function resetData() {
  S.conversations = [];
  S.selectedId = null;
  document.getElementById('app').classList.remove('loaded');
  document.getElementById('drop-screen').style.display = 'flex';
  document.getElementById('drop-error').style.display = 'none';
  document.getElementById('file-input').value = '';
}

// ── Category helpers ─────────────────────────────────────────────────────────

function getCategory(conv) {
  return S.overrides[conv.id] || conv.category || 'uncategorized';
}

const CAT_LABEL = {
  personal: 'Personal', delivery: 'Delivery', spam: 'Spam', uncategorized: 'Other',
};
const CAT_COLOR = {
  personal: 'var(--green)', delivery: 'var(--orange)', spam: 'var(--red)', uncategorized: 'var(--gray)',
};

// ── Wait time ────────────────────────────────────────────────────────────────

function waitHours(conv) {
  if (!conv.last_message_at) return 0;
  return (Date.now() - new Date(conv.last_message_at).getTime()) / 3600000;
}

function waitChip(conv) {
  if (conv.i_replied_last) return null;
  const h = waitHours(conv);
  if (h < 1) {
    const m = Math.max(1, Math.round(h * 60));
    return { label: m + 'm', cls: 'ok' };
  }
  if (h < 24) return { label: Math.round(h) + 'h', cls: 'warn' };
  const d = Math.round(h / 24);
  return { label: d + 'd', cls: h < 72 ? 'danger' : 'critical' };
}

// ── Time formatting ──────────────────────────────────────────────────────────

function relTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const diffMs = Date.now() - d.getTime();
  const m = Math.floor(diffMs / 60000);
  const h = Math.floor(diffMs / 3600000);
  const day = Math.floor(diffMs / 86400000);
  if (m < 1)  return 'now';
  if (m < 60) return m + 'm';
  if (h < 24) return h + 'h';
  if (day < 7) return day + 'd';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function fullTime(dateStr) {
  if (!dateStr) return '';
  return new Date(dateStr).toLocaleString('en-US', {
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
  });
}

// ── Filtering ────────────────────────────────────────────────────────────────

function filtered() {
  const { category, unrepliedOnly, waitHours: minWait, search } = S.filter;
  const q = search.toLowerCase().trim();
  return S.conversations.filter(c => {
    const cat = getCategory(c);
    if (category !== 'all' && cat !== category) return false;
    if (unrepliedOnly && c.i_replied_last) return false;
    if (minWait > 0 && waitHours(c) < minWait) return false;
    if (q) {
      const name = (c.contact_name || '').toLowerCase();
      const phone = (c.phone || '').toLowerCase();
      const last = (c.last_message_text || '').toLowerCase();
      const msgs = (c.messages || []).map(m => (m.text || '').toLowerCase()).join(' ');
      if (!name.includes(q) && !phone.includes(q) && !last.includes(q) && !msgs.includes(q)) {
        return false;
      }
    }
    return true;
  });
}

// ── Stats ────────────────────────────────────────────────────────────────────

function renderStats() {
  const personal    = S.conversations.filter(c => getCategory(c) === 'personal');
  const unreplied   = personal.filter(c => !c.i_replied_last);
  const overdue     = unreplied.filter(c => waitHours(c) >= 72);
  const nonPersonal = S.conversations.filter(c => getCategory(c) !== 'personal').length;

  const bar = document.getElementById('stats-bar');
  bar.innerHTML = [
    `<span class="stat-chip ${unreplied.length ? 'urgent' : ''}"><strong>${unreplied.length}</strong> unreplied personal</span>`,
    `<span class="stat-chip"><strong>${overdue.length}</strong> overdue (3d+)</span>`,
    `<span class="stat-chip"><strong>${nonPersonal}</strong> auto-filtered</span>`,
  ].join('<span style="color:var(--border);padding:0 2px">·</span>');
}

// ── Conversation list ─────────────────────────────────────────────────────────

function initial(conv) {
  const name = conv.contact_name || conv.phone || '?';
  return name.trim()[0].toUpperCase();
}

function renderList() {
  const list = filtered();
  const el   = document.getElementById('conv-list');
  const meta = document.getElementById('list-meta');

  meta.textContent = list.length === 1 ? '1 conversation' : `${list.length} conversations`;

  if (list.length === 0) {
    el.innerHTML = `<div class="conv-empty">No conversations match your filters.</div>`;
    return;
  }

  el.innerHTML = list.map(c => {
    const cat    = getCategory(c);
    const isOver = S.overrides[c.id];
    const chip   = waitChip(c);
    const sel    = c.id === S.selectedId ? ' selected' : '';
    const badgeCls = isOver ? ' override' : '';

    return `<div class="conv-item${sel}" onclick="selectConversation('${esc(c.id)}')">
      <div class="avatar ${cat}">${esc(initial(c))}</div>
      <div class="conv-body">
        <div class="conv-top">
          <span class="conv-name">${esc(c.contact_name || c.phone || 'Unknown')}</span>
          <span class="conv-time">${esc(relTime(c.last_message_at))}</span>
        </div>
        <div class="conv-preview">${esc(c.last_message_text || '')}</div>
        <div class="conv-meta">
          <span class="badge ${cat}${badgeCls}">${esc(CAT_LABEL[cat] || cat)}</span>
          ${chip ? `<span class="wait-chip ${chip.cls}">waiting ${esc(chip.label)}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Detail panel ──────────────────────────────────────────────────────────────

function renderDetail(id) {
  const conv = S.conversations.find(c => c.id === id);
  const emptyEl = document.getElementById('detail-empty');
  const pane    = document.getElementById('detail-pane');

  if (!conv) {
    emptyEl.style.display = 'flex';
    pane.style.display = 'none';
    return;
  }

  emptyEl.style.display = 'none';
  pane.style.display    = 'flex';

  const cat   = getCategory(conv);
  const name  = conv.contact_name || conv.phone || 'Unknown';
  const phone = conv.phone || '';
  const msgs  = conv.messages || [];

  const smsHref = phone ? `sms:${phone.replace(/\s/g, '')}` : '#';

  const bubbles = msgs.map(m => {
    const side = m.from_me ? 'mine' : 'theirs';
    return `<div class="msg-row ${side}">
      <div class="bubble ${side}">${esc(m.text || '')}</div>
      <span class="bubble-time">${esc(fullTime(m.date))}</span>
    </div>`;
  }).join('');

  const overrideBtns = ['personal','delivery','spam','uncategorized'].map(c2 => {
    const active = cat === c2 ? ` active-${c2}` : '';
    return `<button class="override-btn${active}" onclick="overrideCategory('${esc(id)}','${c2}')">${esc(CAT_LABEL[c2])}</button>`;
  }).join('');

  pane.innerHTML = `
    <div class="detail-header">
      <div class="detail-name">${esc(name)}</div>
      ${phone ? `<div class="detail-phone">${esc(phone)}</div>` : ''}
      <div class="detail-actions">
        <span class="detail-cat-badge" style="background:${CAT_COLOR[cat]}">${esc(CAT_LABEL[cat] || cat)}</span>
        ${phone ? `<a class="btn-message" href="${smsHref}">Open in Messages ↗</a>` : ''}
      </div>
    </div>
    <div class="messages-thread">
      ${msgs.length === 0
        ? '<div class="thread-note">No messages in the export window.</div>'
        : `<div class="thread-note">Last ${msgs.length} message${msgs.length === 1 ? '' : 's'}</div>${bubbles}`}
    </div>
    <div class="override-section">
      <div class="override-label">Override category</div>
      <div class="override-btns">${overrideBtns}</div>
    </div>
  `;
}

// ── Actions ───────────────────────────────────────────────────────────────────

function selectConversation(id) {
  S.selectedId = id;
  renderList();
  renderDetail(id);
}

function setCategory(cat) {
  S.filter.category = cat;
  document.querySelectorAll('.cat-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.cat === cat);
  });
  renderList();
}

function handleUnrepliedToggle(checked) {
  S.filter.unrepliedOnly = checked;
  renderList();
}

function handleWaitFilter(val) {
  S.filter.waitHours = parseFloat(val) || 0;
  renderList();
}

let searchTimer;
function handleSearch(val) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    S.filter.search = val;
    renderList();
  }, 120);
}

function overrideCategory(id, cat) {
  const conv = S.conversations.find(c => c.id === id);
  if (!conv) return;

  if (S.overrides[id] === cat || (!S.overrides[id] && conv.category === cat)) {
    // Toggle off — remove override
    delete S.overrides[id];
  } else {
    S.overrides[id] = cat;
  }

  try { localStorage.setItem(OVERRIDE_KEY, JSON.stringify(S.overrides)); } catch (_) {}
  renderStats();
  renderList();
  renderDetail(id);
}

// ── Render all ────────────────────────────────────────────────────────────────

function renderAll() {
  renderStats();
  renderList();
  renderDetail(S.selectedId);
}

// ── Sanitise ──────────────────────────────────────────────────────────────────

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ── Go ────────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
