<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miranda2 – Text Responsiveness</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}
:root {
  --green: #2dd4a0; --yellow: #f5c842; --orange: #f59e42; --red: #ef4444;
  --blue: #6c6ff6;
  --bg: #f4f6ff;
  --surface: rgba(255, 255, 255, 0.76);
  --surface2: rgba(238, 241, 255, 0.85);
  --border: rgba(99, 102, 241, 0.2);
  --text: #131629;
  --text2: rgba(19, 22, 41, 0.74);
  --text3: rgba(19, 22, 41, 0.54);
}
body[data-theme="dark"] {
  --green: #2dd4a0; --yellow: #f5c842; --orange: #f59e42; --red: #ef4444;
  --blue: #8f85ff;
  --bg: #060710;
  --surface: rgba(10, 12, 24, 0.76);
  --surface2: rgba(20, 24, 44, 0.62);
  --border: rgba(196, 181, 253, 0.22);
  --text: #f7f8ff;
  --text2: rgba(247, 248, 255, 0.74);
  --text3: rgba(247, 248, 255, 0.5);
}

/* ── Drop screen ──────────────────────────────────────────── */
#drop-screen {
  display:flex;
  align-items:stretch;
  justify-content:center;
  min-height:100vh;
  padding:0;
  background:#0b0a10;
  position:relative;
  overflow:hidden;
}
#drop-screen::before {
  display:none;
}
#drop-screen.drag-over { filter:saturate(1.08); }
.drop-card {
  width:100%;
  min-height:100vh;
  position:relative;
}
.start-design-frame {
  width:100%;
  height:100vh;
  border:0;
  display:block;
  background:#0b0a10;
}
.start-design-support {
  position:fixed;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:50;
  pointer-events:none;
}
.start-design-support > * {
  pointer-events:auto;
}
.hero-title {
  font-family: 'Times New Roman', Georgia, serif;
  font-style:italic;
  font-size:clamp(56px,8.2vw,134px);
  font-weight:400;
  line-height:0.88;
  letter-spacing:-0.02em;
  margin-bottom:10px;
  color:#f4f1ea;
}
.hero-subhead {
  font-size:clamp(18px,1.9vw,28px);
  line-height:1.25;
  margin-bottom:24px;
  color:rgba(235, 236, 244, 0.88);
  font-weight:500;
  letter-spacing:-0.01em;
}
.hero-actions {
  max-width:760px;
  margin:0 auto;
}
.btn-primary.hero-primary {
  width:100%;
  border:none;
  border-radius:14px;
  padding:16px 20px;
  font-size:30px;
  font-weight:700;
  letter-spacing:-0.01em;
  color:#151318;
  background:#e3f770;
  box-shadow:0 0 0 1px rgba(255,255,255,0.24) inset, 0 18px 40px rgba(57, 70, 17, 0.4);
}
.btn-primary.hero-primary:hover { opacity:0.97;transform:translateY(-1px); }
.hero-secondary-row {
  margin-top:12px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.hero-secondary {
  border:1px solid rgba(214, 216, 232, 0.24);
  border-radius:12px;
  background:rgba(255,255,255,0.03);
  color:#ececf3;
  font-family:inherit;
  font-size:20px;
  font-weight:600;
  letter-spacing:-0.01em;
  padding:12px 16px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
}
.hero-secondary:hover {
  border-color:rgba(227,247,112,0.44);
  background:rgba(227,247,112,0.08);
}
.hero-footer {
  margin-top:18px;
  font-size:17px;
  color:rgba(227, 247, 112, 0.86);
  font-weight:500;
  font-style:italic;
}
.hero-accent {
  color:#e3f770;
}
.hero-stats {
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:12px;
  max-width:760px;
  margin:0 auto 16px;
}
.hero-stat-card {
  text-align:left;
  border-radius:12px;
  border:1px solid rgba(212, 214, 233, 0.18);
  background:rgba(255,255,255,0.03);
  padding:12px;
}
.hero-stat-label {
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:rgba(235, 236, 244, 0.62);
}
.hero-stat-value {
  margin-top:4px;
  font-size:26px;
  font-weight:700;
  color:#f4f1ea;
}
.hero-supporting { margin-top:20px; display:flex; flex-direction:column; gap:10px; }
.btn-primary {
  display:inline-block;background:var(--blue);color:#fff;border:none;border-radius:12px;
  padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:opacity .15s,transform .1s;
}
.btn-primary:hover { opacity:.88;transform:translateY(-1px); }
.drop-hint { margin-top:0;font-size:12px;color:rgba(203,214,245,0.72);line-height:1.5; }
.drop-hint code {
  background:rgba(255,255,255,0.08);border-radius:4px;padding:1px 5px;
  font-family:'DM Mono',monospace;font-size:11px;color:#d8e5ff;
}
#drop-error { margin-top:8px;color:#ff8f9d;font-size:13px;display:none; }
.saved-prompt { margin-top:0;padding-top:0;border-top:none; }
.saved-prompt button {
  background:rgba(255,255,255,0.04);border:1px solid rgba(145,164,245,0.24);border-radius:12px;
  padding:12px 16px;color:#cfd8f6;font-size:13px;font-family:inherit;cursor:pointer;
  transition:all .15s;width:100%;text-align:left;line-height:1.4;
}
.saved-prompt button:hover { background:rgba(255,255,255,0.08);border-color:rgba(173,191,255,0.34);color:#edf2ff; }
.saved-prompt .saved-label { display:block;font-weight:600;margin-bottom:2px;color:#edf2ff; }
.saved-prompt .saved-meta { font-size:11px;color:rgba(194,206,241,0.78); }
.source-panel {
  margin-top:0;padding:10px 12px;border:1px solid rgba(145,164,245,0.2);border-radius:12px;
  background:rgba(255,255,255,0.02);text-align:left;
}
.source-panel-title { font-size:12px;color:rgba(186,198,237,0.72);margin-bottom:4px; }
.source-panel-line { font-size:12px;color:rgba(219,227,249,0.86);margin-bottom:4px; }
.source-panel-actions { display:flex;gap:8px;flex-wrap:wrap;margin-top:8px; }
.source-panel .btn-primary { padding:8px 12px;font-size:12px; }
.btn-secondary {
  font-family:inherit;font-size:12px;padding:8px 12px;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);color:var(--text2);cursor:pointer;
}
.btn-secondary:hover { background:var(--border);color:var(--text); }
.source-error { margin-top:8px;font-size:12px;color:var(--red); }
.source-status { margin-top:8px;font-size:12px;color:#60a5fa;display:none; }
.source-status.is-error { color:var(--red); }
.source-status.is-success { color:#22c55e; }

/* ── App ──────────────────────────────────────────────────── */
#app {
  display:none;flex-direction:column;min-height:100vh;position:relative;
  background:
    radial-gradient(900px 500px at 12% -12%, rgba(34,211,238,0.08), transparent 60%),
    radial-gradient(900px 500px at 88% -10%, rgba(217,70,239,0.1), transparent 62%),
    linear-gradient(180deg, #f5f7ff 0%, #eef2ff 55%, #edf0ff 100%);
}
#app.loaded { display:flex; }
#app.design-inbox-mode > :not(.design-inbox-shell) { display:none !important; }
.design-inbox-shell { display:none; min-height:100vh; }
#app.design-inbox-mode .design-inbox-shell { display:block; }
.design-inbox-frame {
  width:100%;
  height:100vh;
  border:0;
  display:block;
  background:#0b0a10;
}
#app::before {
  content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 20%, rgba(129,140,248,0.08), transparent 55%);
}
body[data-theme="dark"] #app {
  background:
    radial-gradient(900px 500px at 12% -12%, rgba(34,211,238,0.12), transparent 60%),
    radial-gradient(900px 500px at 88% -10%, rgba(217,70,239,0.14), transparent 62%),
    linear-gradient(180deg, #090b17 0%, #070912 55%, #070811 100%);
}

.top-bar {
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 24px;border-bottom:1px solid var(--border);
  background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.top-bar-brand { font-size:13px;font-weight:600;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase; }
.top-bar-actions { display:flex;gap:8px;align-items:center; }
.top-bar-actions select, .top-bar-actions button {
  font-family:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--border);
  border-radius:10px;background:rgba(255,255,255,0.42);color:var(--text3);cursor:pointer;outline:none;
}
.top-bar-actions button:hover { background:rgba(255,255,255,0.7);color:var(--text2); }
.last-updated {
  font-size:12px;color:var(--text3);white-space:nowrap;
}
.last-updated.stale { opacity:0.72; }
.theme-toggle {
  min-width:86px;
}
.source-btn-primary {
  background:rgba(124,140,255,0.2)!important;color:var(--text)!important;border-color:rgba(124,140,255,0.45)!important;
}
.source-btn-primary:hover { background:rgba(124,140,255,0.28)!important; }

/* ── Score ─────────────────────────────────────────────────── */
.score-section {
  display:flex;flex-direction:column;align-items:center;
  padding:22px 24px 10px;
  position:relative;
}
.score-hero {
  display:grid;grid-template-columns:1fr;align-items:center;justify-content:center;
  gap:12px;margin-bottom:4px;width:100%;max-width:760px;
}
.score-left {
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;
}
.score-ring {
  position:relative;width:196px;height:196px;margin:0;
  filter:drop-shadow(0 0 24px rgba(56,189,248,0.28)) drop-shadow(0 0 40px rgba(217,70,239,0.18));
}
.score-ring svg { transform:rotate(-90deg);width:180px;height:180px; }
.score-ring svg { width:196px;height:196px; }
.score-ring .ring-bg { fill:none;stroke:rgba(255,255,255,0.1);stroke-width:10; }
.score-ring .ring-fill { fill:none;stroke-width:10;stroke-linecap:round;stroke:url(#ring-gradient);transition:stroke-dashoffset 1s ease; }
.score-value { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center; }
.score-number { font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1;color:var(--text);font-family:'DM Mono',monospace; }
.score-label { font-size:12px;color:var(--text3);margin-top:6px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600; }
.score-summary {
  font-size:42px;font-weight:700;color:var(--text);text-align:center;line-height:1.03;
  letter-spacing:-0.03em;max-width:780px;
}
.score-summary strong { color:var(--text); }

.contributors { display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;justify-self:end; }
.contrib-card {
  background:
    linear-gradient(135deg, rgba(129,140,248,0.12), rgba(236,72,153,0.08));
  border:1px solid rgba(196,181,253,0.26);border-radius:14px;padding:14px 16px;text-align:left;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 14px 30px rgba(2,6,23,0.24);
}
.contrib-value { font-size:28px;font-weight:700;font-family:'DM Mono',monospace;margin-bottom:4px; }
.contrib-label { font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;font-weight:600; }
.contrib-bar { height:4px;border-radius:2px;background:rgba(255,255,255,0.1);margin-top:10px;overflow:hidden; }
.contrib-bar-fill { height:100%;border-radius:2px;transition:width .8s ease; }

/* ── Action list ──────────────────────────────────────────── */
.action-section { padding:14px 24px 40px;max-width:760px;width:100%;margin:0 auto; }
.action-header { display:flex;align-items:center;justify-content:space-between;padding:22px 0 14px; }
.action-title { font-size:20px;font-weight:600;color:var(--text); }
.action-count { font-size:12px;color:var(--text3); }
.action-filters { display:flex;gap:6px;padding-bottom:16px;flex-wrap:wrap; }
.filter-chip {
  font-family:inherit;font-size:12px;padding:5px 12px;border:1px solid var(--border);
  border-radius:20px;background:rgba(255,255,255,0.02);color:var(--text3);cursor:pointer;transition:all .12s;
}
.filter-chip:hover { border-color:rgba(34,211,238,0.6);color:rgba(34,211,238,0.95); }
.filter-chip.active { background:rgba(34,211,238,0.14);border-color:rgba(34,211,238,0.5);color:#c9f7ff; }
.action-list { display:flex;flex-direction:column;gap:6px; }
.action-item {
  display:flex;flex-direction:column;padding:15px 16px;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:background .12s,border-color .12s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.action-item:hover { background:var(--surface2);border-color:rgba(34,211,238,0.38); }
.action-item.expanded { border-color:rgba(167,139,250,0.7); }
.action-item-top { display:flex;align-items:center;gap:12px; }
.action-avatar {
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:#fff;flex-shrink:0;background:var(--blue);
}
.action-body { flex:1;min-width:0; }
.action-name { font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px; }
.action-preview { font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.action-preview .preview-label { font-weight:600;color:var(--text3);font-size:11px; }
.action-preview-mine { font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px; }
.action-preview-mine .preview-label { font-weight:600;font-size:11px; }
.action-right { display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0; }
.action-time { font-size:12px;color:var(--text3); }
.urgency-dot { width:8px;height:8px;border-radius:50%; }
.urgency-dot.green { background:var(--green); }
.urgency-dot.yellow { background:var(--yellow); }
.urgency-dot.orange { background:var(--orange); }
.urgency-dot.red { background:var(--red); }

.action-detail { display:none;padding:12px 0 4px;border-top:1px solid var(--border);margin-top:12px; }
.action-item.expanded .action-detail { display:block; }
.detail-messages { display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-height:240px;overflow-y:auto; }
.detail-messages > div { background:none;border:0;border-radius:0;padding:0;margin:0;text-align:left; }
.msg-time { font-size:10px;color:var(--text3);margin-top:2px;padding:0 4px; }
.detail-actions { display:flex;gap:8px;align-items:center; }
.btn-reply {
  font-family:inherit;font-size:12px;font-weight:600;padding:7px 16px;border:none;border-radius:10px;
  background:var(--green);color:#0d0d12;cursor:pointer;text-decoration:none;display:inline-block;transition:opacity .12s;
}
.btn-reply:hover { opacity:.85; }
.btn-dismiss {
  font-family:inherit;font-size:12px;font-weight:500;padding:7px 16px;border:1px solid var(--border);
  border-radius:10px;background:none;color:var(--text2);cursor:pointer;transition:all .12s;
}
.btn-dismiss:hover { border-color:var(--text3);color:var(--text); }
.ai-trigger-row { display:flex;justify-content:flex-start;margin-top:6px; }
.ai-suggest-card {
  border:1px solid var(--blue);background:color-mix(in srgb, var(--blue) 8%, var(--surface));
  border-radius:12px;padding:10px 12px;min-width:0;max-width:100%;
}
.ai-suggest-label { font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--blue);margin-bottom:6px; }
.ai-suggest-text { font-size:13px;color:var(--text);line-height:1.35;word-break:break-word; }
.ai-suggest-actions { display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap; }
.ai-use-note { font-size:11px;color:var(--text3); }

.action-empty { text-align:center;padding:48px 20px;color:var(--text3);font-size:14px; }
.action-empty-icon { font-size:36px;margin-bottom:12px; }
.other-section { padding:0 24px 40px;max-width:760px;width:100%;margin:0 auto; }
.other-list { display:flex;flex-direction:column;gap:6px; }
.other-item {
  display:flex;align-items:center;gap:12px;padding:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.other-item:hover { background:var(--surface2);border-color:rgba(34,211,238,0.34); }

::-webkit-scrollbar { width:5px;height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border);border-radius:3px; }

/* ── Trend section ────────────────────────────────────────── */
.trend-section {
  padding:0 24px 8px;max-width:760px;width:100%;margin:0 auto;
}
.trend-card {
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:14px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.trend-header {
  display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:0;
}
#trend-body { margin-top:14px; }
.trend-toggle-row {
  font-family:inherit;font-size:20px;font-weight:600;color:var(--text);
  cursor:pointer;user-select:none;
}
.trend-toggle-row:hover { color:#c8d5ff; }
.trend-preview { font-size:12px;color:var(--text3); }
.trend-stats { display:flex;gap:16px; }
.trend-stat { text-align:center; }
.trend-stat-value { font-size:18px;font-weight:700;font-family:'DM Mono',monospace; }
.trend-stat-label { font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;font-weight:600; }

.trend-chart { position:relative;height:100px;margin-bottom:8px; }
.trend-chart svg { width:100%;height:100%; }
.trend-empty { color:var(--text3);font-size:12px;text-align:center;padding:24px 0; }

.trend-dates {
  display:flex;justify-content:space-between;
  font-size:10px;color:var(--text3);padding:0 2px;
}

.streak-row {
  display:flex;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
}
.streak-badge {
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--surface2);border-radius:10px;padding:10px 12px;
}
.streak-icon { font-size:20px;flex-shrink:0; }
.streak-info {}
.streak-value { font-size:16px;font-weight:700;font-family:'DM Mono',monospace;color:var(--text); }
.streak-label { font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px; }

/* ── Review section ───────────────────────────────────────── */
.review-section {
  padding:8px 24px 40px;max-width:760px;width:100%;margin:0 auto;
}
.review-toggle {
  font-family:inherit;font-size:14px;font-weight:600;color:var(--text2);
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:10px 16px;width:100%;text-align:left;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  transition:all .12s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.review-toggle:hover { border-color:rgba(34,211,238,0.34);color:var(--text); }
.review-arrow { transition:transform .2s; }
.review-arrow.open { transform:rotate(180deg); }
.review-body { margin-top:10px; }
.review-tabs { display:flex;gap:6px;margin-bottom:12px; }
.review-tab {
  font-family:inherit;font-size:12px;padding:5px 12px;
  border:1px solid var(--border);border-radius:20px;background:none;
  color:var(--text2);cursor:pointer;transition:all .12s;
}
.review-tab:hover { border-color:var(--blue);color:var(--blue); }
.review-tab.active { background:var(--blue);border-color:var(--blue);color:#fff; }
.review-tab-count { font-weight:600;margin-left:2px; }
.review-meta { display:flex;align-items:center;gap:8px;margin-left:auto; }
.review-reason {
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;
  padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--text2);
}
.review-reason.spam { border-color:rgba(220,63,63,0.45);color:var(--red); }
.review-reason.delivery { border-color:rgba(217,164,37,0.45);color:var(--yellow); }

.filter-out-menu { position:relative;display:inline-flex;align-items:center; }
.filter-out-menu summary {
  list-style:none;font-family:inherit;font-size:12px;font-weight:500;padding:7px 16px;
  border:1px solid var(--border);border-radius:10px;background:none;color:var(--text2);
  cursor:pointer;transition:all .12s;
}
.filter-out-menu summary::-webkit-details-marker { display:none; }
.filter-out-menu summary:hover { border-color:var(--text3);color:var(--text); }
.filter-out-menu[open] summary { border-color:var(--blue);color:var(--blue); }
.filter-out-popover {
  position:absolute;top:calc(100% + 6px);left:0;z-index:10;min-width:130px;
  display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.18);
}
.filter-out-popover button {
  text-align:left;font-family:inherit;font-size:12px;padding:6px 8px;background:none;
  border:0;border-radius:8px;color:var(--text2);cursor:pointer;
}
.filter-out-popover button:hover { background:var(--surface2);color:var(--text); }
.review-list { display:flex;flex-direction:column;gap:4px;max-height:400px;overflow-y:auto; }
.review-item {
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  font-size:13px;
}
.review-name { font-weight:600;color:var(--text);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis; }
.review-preview { flex:1;color:var(--text2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0; }
.review-btn {
  font-family:inherit;font-size:11px;font-weight:500;padding:4px 10px;
  border:1px solid var(--border);border-radius:8px;background:none;
  color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .12s;
}
.review-btn:hover { border-color:var(--green);color:var(--green); }
.review-btn.to-spam { }
.review-btn.to-spam:hover { border-color:var(--red);color:var(--red); }
.review-empty { color:var(--text3);font-size:12px;text-align:center;padding:20px 0; }
.other-signal-bar {
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:8px;padding:8px 10px;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);
}
.other-signal-meta { display:flex;flex-direction:column;gap:2px;min-width:0; }
.other-signal-status { font-size:12px;color:var(--text2);font-weight:600; }
.other-signal-help { font-size:11px;color:var(--text3); }
.other-signal-actions { display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end; }
.review-btn.secondary:hover { border-color:var(--text3);color:var(--text2); }
.other-signal-input {
  width:120px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font-size:12px;
}

@media (max-width:600px) {
  .top-bar { flex-wrap:wrap; }
  .contributors { max-width:none;justify-self:stretch; }
  .score-hero { gap:14px; }
  .score-left { align-items:center; }
  .score-ring { width:150px;height:150px; }
  .score-ring svg { width:150px;height:150px; }
  .score-number { font-size:42px; }
  .score-summary { font-size:32px;text-align:center; }
  .drop-card { padding:40px 28px; }
  .score-summary { font-size:22px;text-align:center; }
  .drop-card { padding:0; }
  .hero-title { margin-bottom:12px; }
  .hero-subhead { margin-bottom:20px; }
  .hero-stats { grid-template-columns:1fr; margin-bottom:14px; }
  .btn-primary.hero-primary { padding:12px 12px; font-size:22px; }
  .hero-secondary-row { grid-template-columns:1fr; gap:10px; }
  .hero-secondary { font-size:18px; padding:11px 11px; }
  .hero-footer { font-size:15px; margin-top:16px; }
}
@media (min-width:768px) {
  .score-hero { grid-template-columns:minmax(0,1fr) 330px; }
  .score-summary { text-align:left; }
}
</style>

<body>

<div id="drop-screen">
  <div class="drop-card">
    <iframe
      id="start-design-frame"
      class="start-design-frame"
      src="docs/Reply%20or%20Die%20_standalone_.html"
      title="Reply or Die start design"
    ></iframe>
    <input type="file" id="file-input" accept=".json" style="display:none">
    <div class="hero-supporting start-design-support">
      <div id="drop-error"></div>
      <div class="source-panel" id="source-panel-drop" style="display:none">
        <div class="source-panel-title" id="source-title-drop">Connected export file</div>
        <div class="source-panel-line" id="source-name-drop"></div>
        <div class="source-panel-actions">
          <button class="btn-primary" id="connect-export-btn-drop" onclick="connectExportFile()">Connect export file</button>
          <button class="btn-primary" id="refresh-btn-drop" onclick="refresh()" style="display:none">Refresh</button>
          <button class="btn-secondary" id="change-source-btn-drop" onclick="changeSource()">Change source</button>
        </div>
        <div class="source-status" id="source-status-drop" style="display:none"></div>

</div>

<div id="app">
  <div class="design-inbox-shell">
    <iframe
      id="inbox-design-frame"
      class="design-inbox-frame"
      src="docs/Reply%20or%20Die%20_standalone_.html"
      title="Reply or Die inbox design"
    ></iframe>
  </div>

  <div class="top-bar">
    <span class="top-bar-brand">Reply or Die</span>
    <div class="top-bar-actions">
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">dark mode</button>
      <select id="timeline-filter" onchange="handleTimeline(this.value)">
        <option value="1">Last 24 hours</option>
        <option value="3">Last 3 days</option>
        <option value="7" selected>Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 3 months</option>
        <option value="">All time</option>
      </select>
      <span class="last-updated" id="last-updated" style="display:none"></span>
      <button id="refresh-btn-app" class="source-btn-primary" style="display:none" onclick="refresh()">Refresh</button>
      <span class="source-status" id="source-status-app" style="display:none"></span>

    </div>

  <div class="score-section">
    <div class="score-hero">
      <div class="score-left">
        <div class="score-summary" id="score-summary"></div>
        <div class="score-ring">
          <svg viewBox="0 0 180 180">
            <defs>
              <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#22d3ee"/>
                <stop offset="52%" stop-color="#8b5cf6"/>
                <stop offset="100%" stop-color="#ec4899"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="90" cy="90" r="78"/>
            <circle class="ring-fill" id="ring-fill" cx="90" cy="90" r="78" stroke-dasharray="490" stroke-dashoffset="490"/>
          </svg>
          <div class="score-value">
            <div class="score-number" id="score-number">--</div>
            <div class="score-label">Score</div>
          </div>
        </div>
      </div>
      <div class="contributors">
        <div class="contrib-card">
          <div class="contrib-value" id="contrib-rate" style="color:var(--green)">--%</div>
          <div class="contrib-label">Reply rate</div>
          <div class="contrib-bar"><div class="contrib-bar-fill" id="contrib-rate-bar" style="background:var(--green);width:0%"></div></div>
        </div>
        <div class="contrib-card">
          <div class="contrib-value" id="contrib-speed" style="color:var(--yellow)">--</div>
          <div class="contrib-label">Avg wait</div>
          <div class="contrib-bar"><div class="contrib-bar-fill" id="contrib-speed-bar" style="background:var(--yellow);width:0%"></div></div>
        </div>
        <div class="contrib-card">
          <div class="contrib-value" id="contrib-hanging" style="color:var(--red)">--</div>
          <div class="contrib-label">Hanging</div>
          <div class="contrib-bar"><div class="contrib-bar-fill" id="contrib-hanging-bar" style="background:var(--red);width:0%"></div></div>

  <!-- Trend -->
  <div class="trend-section">

          <span id="trend-toggle-label">Score history ▾</span>
        </div>
        <div class="trend-preview" id="trend-preview">Last 7d score: --</div>

      <div id="trend-body" style="display:none">
        <div class="trend-stats">
          <div class="trend-stat">
            <div class="trend-stat-value" id="trend-best" style="color:var(--green)">--</div>
            <div class="trend-stat-label">Best</div>
          </div>
          <div class="trend-stat">
            <div class="trend-stat-value" id="trend-avg" style="color:var(--yellow)">--</div>
            <div class="trend-stat-label">Avg</div>
          </div>
          <div class="trend-stat">
            <div class="trend-stat-value" id="trend-sessions">--</div>
            <div class="trend-stat-label">Sessions</div>
          </div>
        </div>
        <div class="trend-chart" id="trend-chart"></div>
        <div class="trend-dates" id="trend-dates"></div>
        <div class="streak-row">
          <div class="streak-badge">
            <div class="streak-icon">🔥</div>
            <div class="streak-info">
              <div class="streak-value" id="streak-current">0</div>
              <div class="streak-label">Day streak</div>
            </div>
          </div>
          <div class="streak-badge">
            <div class="streak-icon">⚡</div>
            <div class="streak-info">
              <div class="streak-value" id="streak-longest">0</div>
              <div class="streak-label">Longest streak</div>
            </div>
          </div>
          <div class="streak-badge">
            <div class="streak-icon">📈</div>
            <div class="streak-info">
              <div class="streak-value" id="trend-delta">--</div>
              <div class="streak-label">vs last</div>
            </div>
          </div>
        </div>

  </div>

  <div class="action-section">
    <div class="action-header">
      <span class="action-title">Action needed</span>
      <span class="action-count" id="action-count"></span>
    </div>
    <div class="action-filters" id="action-filters">
      <button class="filter-chip active" data-filter="all" onclick="setActionFilter('all')">All</button>
      <button class="filter-chip" data-filter="urgent" onclick="setActionFilter('urgent')">Urgent (24h+)</button>
      <button class="filter-chip" data-filter="today" onclick="setActionFilter('today')">Today</button>
    </div>
    <div class="action-list" id="action-list"></div>
  </div>

  <div class="other-section">
    <div class="action-header">
      <span class="action-title">Other texts</span>
      <span class="action-count" id="other-count"></span>
    </div>
    <div class="other-list" id="other-list"></div>
  </div>

  <!-- Category review -->
  <div class="review-section">
    <button class="review-toggle" id="review-toggle" onclick="toggleReview()">
      <span id="review-toggle-label">Auto-filtered texts</span>
      <span class="review-arrow" id="review-arrow">▾</span>
    </button>
    <div class="review-body" id="review-body" style="display:none">
      <div class="review-tabs" id="review-tabs">
        <button class="review-tab active" data-cat="filtered" onclick="setReviewCat('filtered')">Filtered out <span id="review-count-filtered" class="review-tab-count"></span></button>
      </div>
      <div class="review-list" id="review-list"></div>
    </div>
  </div>
</div>

<script>
const S = {
  conversations: [], overrides: {}, dismissed: {}, newIds: new Set(),
  selectedId: null, actionFilter: 'all', reviewCat: 'filtered', reviewOpen: false,
  trendOpen: false, theme: 'light',
  nameSignalFirst: '', nameSignalEditing: false,
  homeSetupOpen: false,
  filter: { timelineAfter: null, timelineBefore: null },
  exportTimestamp: null, exportTimestampSource: null, lastUpdatedTimer: null,
  dataSourceKind: 'local_file',
  replyAssistById: {}, // { [threadId]: { isGenerating, suggestedReply, generationAttempted, copied, regenerateCount } }
  connectedSource: {
    supported: false, canPersist: false, supportReason: '',
    handle: null, fileName: '', lastRefreshedAt: null,
    refreshState: 'idle', runnerUrl: 'http://127.0.0.1:8765'
  }
};
const OVERRIDE_KEY='miranda2_overrides_v1', DISMISS_KEY='miranda2_dismissed_v2',
      DATA_KEY='miranda2_data_v1', META_KEY='miranda2_meta_v1', HISTORY_KEY='miranda2_history_v1',
      NAME_SIGNAL_KEY='miranda2_name_signal_v1', THEME_KEY='miranda2_theme_v1',
      CONNECTED_SOURCE_DB='miranda2_connected_source_v1', CONNECTED_SOURCE_STORE='sources', CONNECTED_SOURCE_KEY='primary';
const LEGACY_DISMISS_KEY='miranda2_dismissed_v1';
const PREVIEW_INCLUDE_ATTACHMENT=true; // set false to hide "📎 Attachment" rows in collapsed previews
const DEFAULT_AI_MODEL='gpt-4.1-mini';
const AI_SUGGEST_ROUTE='/api/ai-suggest-reply';
const AI_ALLOWED_DEMO_THREAD_IDS=new Set([
  'iMessage;-;+12125550101', // bird accusation
  'iMessage;-;+12125550102', // Michael Scott
  'iMessage;-;+12125550110', // minor European princess
  'iMessage;-;+12125550109', // hyperlocal media disruption engine
  'iMessage;-;+12125550105', // branding exercise
  'iMessage;-;+12125550107', // parking ticket for emotional reasons
  'iMessage;-;+12125550108', // Fleabag
  'iMessage;-;+12125550103', // society's collapsing dinner
  'iMessage;-;+12125550104'  // it's about longing
]);

async function init() {
  try { const r=localStorage.getItem(OVERRIDE_KEY); if(r) S.overrides=JSON.parse(r); } catch(_){}
  try {
    const r=localStorage.getItem(DISMISS_KEY);
    if(r)S.dismissed=JSON.parse(r);
    else{
      const legacy=localStorage.getItem(LEGACY_DISMISS_KEY);
      if(legacy)S.dismissed=JSON.parse(legacy);
    }
  } catch(_){}
  try { const r=localStorage.getItem(NAME_SIGNAL_KEY); if(r) S.nameSignalFirst=JSON.parse(r).firstName||''; } catch(_){}
  try {
    const savedTheme=localStorage.getItem(THEME_KEY);
    S.theme=savedTheme==='dark'?'dark':'light';
  } catch(_) { S.theme='light'; }
  applyTheme();
  wireStartDesignIframe();
  checkSavedData();
  const ds=document.getElementById('drop-screen');
  ds.addEventListener('dragover',e=>{e.preventDefault();ds.classList.add('drag-over');});
  ds.addEventListener('dragleave',()=>ds.classList.remove('drag-over'));
  ds.addEventListener('drop',e=>{e.preventDefault();ds.classList.remove('drag-over');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);});
  document.getElementById('file-input').addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0]);});
  if(!localStorage.getItem(DATA_KEY)){
    try{
      const response=await fetch('./data/miranda_demo.json');
      if(response.ok){
        const demoData=timeShiftBundledDemoData(await response.json());
        localStorage.setItem(DATA_KEY,JSON.stringify(demoData));
        localStorage.setItem(META_KEY,JSON.stringify({
          savedAt:new Date().toISOString(),
          count:(demoData.conversations||[]).length,
          sourceType:'demo'
        }));
        checkSavedData();
      }
    }catch(_){}
  }
  await initConnectedSource();
  renderSourceUi();
  setRefreshState('idle');
}

function wireStartDesignIframe(){
  const frame=document.getElementById('start-design-frame');
  if(!frame)return;
  frame.addEventListener('load',()=>{
    let doc=null;
    try{doc=frame.contentDocument||frame.contentWindow.document;}catch(_){return;}
    if(!doc)return;

    const text=(el)=>(el&&el.textContent||'').trim().toLowerCase();
    const allButtons=Array.from(doc.querySelectorAll('button'));

    const demoBtn=allButtons.find(b=>text(b).includes('see the demo inbox'));
    if(demoBtn){
      demoBtn.onclick=(e)=>{e.preventDefault();enterDemoInbox();};
    }

    const refreshBtn=allButtons.find(b=>text(b).includes('one-click refresh'));
    if(refreshBtn){
      refreshBtn.onclick=(e)=>{e.preventDefault();openRefreshSetup();};
    }

    const uploadBtn=allButtons.find(b=>text(b).includes('upload export file'));
    if(uploadBtn){
      uploadBtn.onclick=(e)=>{e.preventDefault();document.getElementById('file-input').click();};
    }

    const navInbox=doc.querySelector('button[data-nav="inbox"]');
    if(navInbox){
      navInbox.onclick=(e)=>{e.preventDefault();enterDemoInbox();};
    }

    const navScore=doc.querySelector('button[data-nav="score"]');
    if(navScore){
      navScore.onclick=(e)=>{e.preventDefault();showDropError('Score redesign is coming next.');};
    }

    const navSettings=doc.querySelector('button[data-nav="settings"]');
    if(navSettings){
      navSettings.onclick=(e)=>{e.preventDefault();showDropError('Settings redesign is coming next.');};
    }
  });
}

function checkSavedData(){
  try{const m=JSON.parse(localStorage.getItem(META_KEY)),d=localStorage.getItem(DATA_KEY);
  if(m&&d){
    const metaEl=document.getElementById('saved-meta');
    const promptEl=document.getElementById('saved-prompt');
    if(metaEl)metaEl.textContent=`${m.count||'?'} conversations · saved ${timeSince(m.savedAt)}`;
    if(promptEl)promptEl.style.display='block';
  }}catch(_){}
}
function timeSince(d){const ms=Date.now()-new Date(d).getTime(),m=Math.floor(ms/60000);
  if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);
  if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}

function loadSavedData(){try{const r=localStorage.getItem(DATA_KEY);if(!r)return;
  const parsed=JSON.parse(r);
  S.newIds.clear();loadData(parsed,false,getSavedSourceKind());}catch(ex){showDropError('Could not load: '+ex.message);}}

async function enterDemoInbox(){
  try{
    const existing=localStorage.getItem(DATA_KEY);
    if(existing){
      S.newIds.clear();
      loadData(JSON.parse(existing),false,getSavedSourceKind());
      return;
    }
    const response=await fetch('./data/miranda_demo.json');
    if(!response.ok)throw new Error('Could not load bundled demo data.');
    const demoData=timeShiftBundledDemoData(await response.json());
    localStorage.setItem(DATA_KEY,JSON.stringify(demoData));
    localStorage.setItem(META_KEY,JSON.stringify({
      savedAt:new Date().toISOString(),
      count:(demoData.conversations||[]).length,
      sourceType:'demo'
    }));
    checkSavedData();
    S.newIds.clear();
    loadData(demoData,false,'demo');
  }catch(ex){
    showDropError(ex.message||'Could not open demo inbox.');
  }
}

function openRefreshSetup(){
  S.homeSetupOpen=true;
  renderSourceUi();
  const panel=document.getElementById('source-panel-drop');
  if(panel){
    panel.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
}

function loadFile(file){
  document.getElementById('drop-error').style.display='none';
  if(!file.name.endsWith('.json')){
    const msg='Please select a .json file.';
    showDropError(msg);
    return Promise.reject(new Error(msg));
  }
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error||new Error('Could not read file.'));
    reader.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        if(!data.conversations)throw new Error('Missing "conversations" key.');
        diffNew(data);
        loadData(data,true,'local_file');
        resolve(data);
      }catch(ex){
        const err=new Error('Could not parse: '+ex.message);
        showDropError(err.message);
        reject(err);
      }
    };
    reader.readAsText(file);
  });
}
function diffNew(nd){S.newIds.clear();try{const o=localStorage.getItem(DATA_KEY);if(!o)return;
  const old=new Set((JSON.parse(o).conversations||[]).map(c=>c.id));
  (nd.conversations||[]).forEach(c=>{if(!old.has(c.id))S.newIds.add(c.id);});}catch(_){}}

function showDropError(msg){const el=document.getElementById('drop-error');el.textContent=msg;el.style.display='block';}
function setSourceError(msg){
  ['source-error-drop','source-error-app'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    if(!msg){el.style.display='none';el.textContent='';return;}
    el.style.display='block';el.textContent=msg;
  });
}

function setSourceStatus(msg,tone){
  ['source-status-drop','source-status-app'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    if(!msg){
      el.style.display='none';
      el.textContent='';
      el.classList.remove('is-error','is-success');
      return;
    }
    el.style.display='block';
    el.textContent=msg;
    el.classList.remove('is-error','is-success');
    if(tone==='error')el.classList.add('is-error');
    if(tone==='success')el.classList.add('is-success');
  });
}

function setRefreshState(state){
  S.connectedSource.refreshState=state;
  const labels={
    idle:'Idle',
    running_export:'Running export.command…',
    reloading_data:'Reloading data…',
    success:'Refresh complete.',
    export_failed:'Export failed. Keeping last successful data loaded.',
    runner_unavailable:'Runner unavailable. You can still reload current JSON.',
    output_unchanged:'Export finished, but output is unchanged.',
    stale_file:'No new data — double-click export.command to refresh.'
  };
  const tone=state==='export_failed'||state==='runner_unavailable'?'error':(state==='success'?'success':'');
  setSourceStatus(labels[state]||'Idle',tone);
}

function renderSourceUi(){
  const supported=S.connectedSource.supported;
  const connected=!!S.connectedSource.handle;
  const sourcePanel=document.getElementById('source-panel-drop');
  const sourceTitle=document.getElementById('source-title-drop');
  const sourceName=document.getElementById('source-name-drop');
  if(sourcePanel){
    sourcePanel.style.display=S.homeSetupOpen?'block':'none';
    if(!S.homeSetupOpen){
      setSourceStatus('', '');
      setSourceError('');
      return;
    }
    if(!supported){
      sourceTitle.textContent='Connected export file';
      sourceName.textContent=S.connectedSource.supportReason||'One-click refresh is unavailable in this browser or page context.';
    }else if(!connected){
      sourceTitle.textContent='Connected export file';
      sourceName.textContent=S.connectedSource.canPersist
        ? 'Connect once, then use Refresh.'
        : 'Connect file for this session, then use Refresh.';
    }else{
      const nameText=`Connected file: ${S.connectedSource.fileName||'miranda2_messages.json'}`;
      sourceTitle.textContent='Connected export file';
      sourceName.textContent=nameText;
    }
  }
  const connectIds=['connect-export-btn-drop'];
  const refreshIds=['refresh-btn-drop','refresh-btn-app'];
  const changeIds=['change-source-btn-drop'];
  connectIds.forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=(supported&&!connected)?'inline-block':'none';});
  refreshIds.forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=(supported&&connected)?'inline-block':'none';});
  changeIds.forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=(supported&&connected)?'inline-block':'none';});
}

function openConnectedSourceDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(CONNECTED_SOURCE_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(CONNECTED_SOURCE_STORE))db.createObjectStore(CONNECTED_SOURCE_STORE);};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('Failed to open IndexedDB'));
  });
}

async function saveConnectedSourceRecord(record){
  const db=await openConnectedSourceDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(CONNECTED_SOURCE_STORE,'readwrite');
    tx.objectStore(CONNECTED_SOURCE_STORE).put(record,CONNECTED_SOURCE_KEY);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error('Could not save source'));
  });
  db.close();
}

async function loadConnectedSourceRecord(){
  const db=await openConnectedSourceDb();
  const result=await new Promise((resolve,reject)=>{
    const tx=db.transaction(CONNECTED_SOURCE_STORE,'readonly');
    const req=tx.objectStore(CONNECTED_SOURCE_STORE).get(CONNECTED_SOURCE_KEY);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error||new Error('Could not read source'));
  });
  db.close();
  return result;
}

async function clearConnectedSourceRecord(){
  const db=await openConnectedSourceDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(CONNECTED_SOURCE_STORE,'readwrite');
    tx.objectStore(CONNECTED_SOURCE_STORE).delete(CONNECTED_SOURCE_KEY);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error('Could not clear source'));
  });
  db.close();
}

async function initConnectedSource(){
  const hasPicker=typeof window.showOpenFilePicker==='function';
  const hasIndexedDb=typeof window.indexedDB!=='undefined';
  const secureContext=window.isSecureContext===true;
  S.connectedSource.supported=hasPicker;
  S.connectedSource.canPersist=hasIndexedDb;
  if(!hasPicker){
    S.connectedSource.supportReason=secureContext
      ? 'One-click refresh is unavailable in this browser.'
      : 'One-click refresh is unavailable in this page context. Use localhost/HTTPS.';
    return;
  }
  if(!hasIndexedDb){
    S.connectedSource.supportReason='One-click refresh is available, but connected file won’t persist after reload.';
    return;
  }
  try{
    const saved=await loadConnectedSourceRecord();
    if(!saved||!saved.handle)return;
    S.connectedSource.handle=saved.handle;
    S.connectedSource.fileName=saved.fileName||'miranda2_messages.json';
    S.connectedSource.lastRefreshedAt=saved.lastRefreshedAt||null;
  }catch(_){
    S.connectedSource.canPersist=false;
    setSourceError('Connected source could not be restored. Re-connect export file for this session.');
  }
}

async function ensureReadPermission(handle){
  if(!handle)return false;
  try{
    if((await handle.queryPermission({mode:'read'}))==='granted')return true;
    if((await handle.requestPermission({mode:'read'}))==='granted')return true;
  }catch(_){}
  return false;
}

async function connectExportFile(){
  setSourceError('');
  if(!S.connectedSource.supported){setSourceError('Connect not supported. Import file manually.');renderSourceUi();return;}
  try{
    const [handle]=await window.showOpenFilePicker({multiple:false,types:[{description:'JSON export',accept:{'application/json':['.json']}}]});
    if(!handle)return;
    const file=await handle.getFile();
    const refreshedAt=new Date().toISOString();
    if(S.connectedSource.canPersist){
      await saveConnectedSourceRecord({handle,fileName:file.name,lastRefreshedAt:refreshedAt});
    }
    S.connectedSource.handle=handle;
    S.connectedSource.fileName=file.name;
    S.connectedSource.lastRefreshedAt=refreshedAt;
    await loadFile(file);
    setRefreshState('idle');
    renderSourceUi();
  }catch(ex){
    if(ex&&ex.name==='AbortError')return;
    setSourceError('Connect failed. Import file manually.');
  }
}

async function refreshMessages(){
  setSourceError('');
  setSourceStatus('',null);
  if(!S.connectedSource.supported){setSourceError('Refresh failed. Import file manually.');return false;}
  if(!S.connectedSource.handle){setSourceError('Refresh failed. Import file manually.');renderSourceUi();return false;}
  try{
    setRefreshState('reloading_data');
    const allowed=await ensureReadPermission(S.connectedSource.handle);
    if(!allowed){
      setRefreshState('export_failed');
      setSourceError('Reload failed (permission denied). Import file manually.');
      return false;
    }
    const file=await S.connectedSource.handle.getFile();
    const refreshedAt=new Date().toISOString();
    S.connectedSource.lastRefreshedAt=refreshedAt;
    if(S.connectedSource.canPersist){
      await saveConnectedSourceRecord({handle:S.connectedSource.handle,fileName:file.name,lastRefreshedAt:refreshedAt});
    }
    await loadFile(file);
    setRefreshState('success');
    renderSourceUi();
    return true;
  }catch(_){
    setRefreshState('export_failed');
    setSourceError('Reload failed. Import file manually.');
    return false;
  }
}

async function refresh(){
  setSourceError('');
  setSourceStatus('',null);
  if(!S.connectedSource.supported||!S.connectedSource.handle){
    setSourceError('No connected file. Use Home to reconnect.');
    renderSourceUi();
    return;
  }
  const beforeTs=S.exportTimestamp||null;
  let runResult=null;
  // Try local runner; silently fall through to file reload if unavailable
  try{
    setRefreshState('running_export');
    const resp=await fetch(`${S.connectedSource.runnerUrl}/run-export`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({})
    });
    if(!resp.ok){
      setRefreshState('export_failed');
      const payload=await resp.json().catch(()=>({}));
      setSourceError(payload.error||'Export failed. Keeping last successful data loaded.');
      return;
    }
    runResult=await resp.json();
    if(!runResult||runResult.ok!==true){
      setRefreshState('export_failed');
      setSourceError((runResult&&runResult.error)||'Export failed. Keeping last successful data loaded.');
      return;
    }
  }catch(_){/* runner not running — fall through to file reload */}
  const reloaded=await refreshMessages();
  if(!reloaded)return;
  if(runResult){
    if(runResult.changed===false){setRefreshState('output_unchanged');}
  }else if(beforeTs&&S.exportTimestamp===beforeTs){
    setRefreshState('stale_file');
  }
}

async function changeSource(){
  setSourceError('');
  try{if(S.connectedSource.supported&&S.connectedSource.canPersist)await clearConnectedSourceRecord();}catch(_){}
  S.connectedSource.handle=null;
  S.connectedSource.fileName='';
  S.connectedSource.lastRefreshedAt=null;
  setRefreshState('idle');
  renderSourceUi();
}

}

function timeShiftBundledDemoData(data){
  const cloned=(typeof structuredClone==='function')
    ? structuredClone(data)
    : JSON.parse(JSON.stringify(data));
  const exportedMs=new Date(cloned.exported_at).getTime();
  if(Number.isNaN(exportedMs))return cloned;
  const deltaMs=Date.now()-exportedMs;
  const shiftIso=(iso)=>{
    const ms=new Date(iso).getTime();
    if(Number.isNaN(ms))return iso;
    return new Date(ms+deltaMs).toISOString();
  };
  cloned.exported_at=shiftIso(cloned.exported_at);
  cloned.__miranda_source='demo';
  (cloned.conversations||[]).forEach(c=>{
    c.last_message_at=shiftIso(c.last_message_at);
    c.latest_inbound_at=shiftIso(c.latest_inbound_at);
    (c.messages||[]).forEach(m=>{m.date=shiftIso(m.date);});
  });
  return cloned;
}

function wireInboxDesignIframe(){
  const frame=document.getElementById('inbox-design-frame');
  if(!frame)return;
  const apply=()=>{
  if(!frame||frame.dataset.wired==='1')return;
  frame.dataset.wired='1';
  frame.addEventListener('load',()=>{
    let doc=null;
    let win=null;
    try{
      win=frame.contentWindow;
      doc=frame.contentDocument||win.document;
    }catch(_){return;}
    if(!doc)return;

    try{ if(win)win.localStorage.setItem('rod_screen','inbox'); }catch(_){}
    let tries=0;
    const timer=setInterval(()=>{
      tries+=1;
      try{
        if(win&&typeof win.go==='function'){
          win.go('inbox');
          clearInterval(timer);
          return;
        }
        const inboxBtn=doc.querySelector('button[data-nav="inbox"]');
        if(inboxBtn){
          inboxBtn.click();
          clearInterval(timer);
          return;
        }
      }catch(_){}
      if(tries>40)clearInterval(timer);
    },50);
    try{
      if(win&&typeof win.go==='function')win.go('inbox');
      else{
        const inboxBtn=doc.querySelector('button[data-nav="inbox"]');
        if(inboxBtn)inboxBtn.click();
      }
    }catch(_){ }

    const landingBtn=doc.querySelector('button[data-nav="landing"]');
    if(landingBtn){
      landingBtn.onclick=(e)=>{e.preventDefault();resetData();};
    }

    const refreshBtn=doc.getElementById('refreshBtn');
    if(refreshBtn){
      refreshBtn.onclick=(e)=>{e.preventDefault();refresh();};
    }
    renderDesignInboxStatus();
  };
  if(frame.dataset.wired!=='1'){
    frame.dataset.wired='1';
    frame.addEventListener('load',apply);
  }
  if(frame.contentDocument?.readyState==='complete')apply();
  });
}

function setLastUpdatedTimestamp(data){
  let iso=(data&&data.exported_at)||null,source='exported_at';
  if(!iso){clearLastUpdatedTimestamp();return;}
  const ts=new Date(iso);
  if(Number.isNaN(ts.getTime())){clearLastUpdatedTimestamp();return;}
  S.exportTimestamp=ts.toISOString();
  S.exportTimestampSource=source;
  renderLastUpdated();
  if(S.lastUpdatedTimer)clearInterval(S.lastUpdatedTimer);
  S.lastUpdatedTimer=setInterval(renderLastUpdated,60000);
}

function clearLastUpdatedTimestamp(){
  if(S.lastUpdatedTimer){clearInterval(S.lastUpdatedTimer);S.lastUpdatedTimer=null;}
  S.exportTimestamp=null;S.exportTimestampSource=null;
  const el=document.getElementById('last-updated');
  if(!el)return;
  el.style.display='inline';
  el.textContent=(S.dataSourceKind==='demo')?'Demo data':'Local file';
  el.title='';
  el.classList.remove('stale');
  renderDesignInboxStatus();
}

function relativeLastUpdated(d){
  const ms=Date.now()-new Date(d).getTime();
  const m=Math.floor(ms/60000);
  if(m<1)return'just now';
  if(m<60)return`${m}m ago`;
  const h=Math.floor(m/60);
  if(h<24)return`${h}h ago`;
  return`${Math.floor(h/24)}d ago`;
}

function renderLastUpdated(){
  const el=document.getElementById('last-updated');
  if(!el)return;
  if(S.dataSourceKind==='demo'){
    el.textContent='Demo data';
    el.title='';
    el.classList.remove('stale');
    el.style.display='inline';
    renderDesignInboxStatus();
    return;
  }
  if(!S.exportTimestamp){
    el.textContent='Local file';
    el.title='';
    el.classList.remove('stale');
    el.style.display='inline';
    renderDesignInboxStatus();
    return;
  }
  const ts=new Date(S.exportTimestamp);
  if(Number.isNaN(ts.getTime())){clearLastUpdatedTimestamp();return;}
  const rel=relativeLastUpdated(S.exportTimestamp);
  el.textContent=`Local file • updated ${rel}`;
  el.title=ts.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
  const ageHrs=(Date.now()-ts.getTime())/3600000;
  if(ageHrs>24)el.classList.add('stale');else el.classList.remove('stale');
  el.style.display='inline';
  renderDesignInboxStatus();
}

function getSavedSourceKind(){
  try{
    const m=JSON.parse(localStorage.getItem(META_KEY));
    return (m&&m.sourceType==='demo')?'demo':'local_file';
  }catch(_){}
  return 'local_file';
}

function looksLikeBundledDemoData(data){
  const ids=new Set((data&&data.conversations||[]).map(c=>String(c.id||'')));
  const required=[
    'iMessage;-;+12125550101',
    'iMessage;-;+12125550102',
    'iMessage;-;+12125550103',
    'iMessage;-;+12125550104',
    'iMessage;-;+12125550105'
  ];
  return required.every(id=>ids.has(id));
}

function resolveDataSourceKind(data,hintKind){
  if(hintKind==='demo'||hintKind==='local_file')return hintKind;
  if(data&&data.__miranda_source==='demo')return'demo';
  if(getSavedSourceKind()==='demo')return'demo';
  if(looksLikeBundledDemoData(data))return'demo';
  return'local_file';
}

function getDataStatusLabel(){
  if(S.dataSourceKind==='demo')return'Demo data';
  if(S.exportTimestamp){
    return `Local file • updated ${relativeLastUpdated(S.exportTimestamp)}`;
  }
  return 'Local file';
}

// ── Recategorize ─────────────────────────────────────────────────────────────
function hasManualOverride(c){
  return !!((c.phone&&S.overrides[c.phone])||S.overrides[c.id]);
}

function isEligiblePersonalRecheck(c){
  return c.category==='personal'&&!c.contact_name&&!c.is_group&&!hasManualOverride(c);
}

function isHighConfidenceRideshare(t){
  const BRAND=['lyft','uber'];
  const TXN=['your driver','trip with','arriving in','arriving now','look for','license plate','pickup spot'];
  return BRAND.some(k=>t.includes(k))&&TXN.some(k=>t.includes(k));
}

function recategorize(){
  const SPAM=['trump','democrat','republican','midterm','gop ','dems ','vote yes','vote no','vote for',
    'polling','campaign','petition','volunteer','election day','ballot',
    'kelly services','randstad','recruiter at','recruitment','found a role','job opportunity',
    'job details','career goals','career options','open for work','open to work','hiring manager',
    'may i share','can i share','share the job','your resume','from indeed',
    'exclusive offer','limited time','act now',"don't miss",'sale ends','promo code','discount code','% off',
    'we made room','we cleared a spot','best deal','membership expires','free trial','expires tomorrow',
    '% return','percent return','locking in a stock','vip investors','paid opportunity','paid survey',
    'match.com','singles in','home solo','first introduction','dating profile',
    'dental check-up','check-up & cleaning','teeth whitening','we have openings',
    'open house','price reduced','home for sale','just listed','mls#','mls #','sq ft','sqft',
    'bd/','ba ','purchasing 1031','real estate',
    'reply stop','reply y to','text stop','opt out','opt-out','unsubscribe','msg & data rates',
    'free msg:','free msg ','we need your','we noticed','we selected','we found',
    'selected for','chosen for','quick conversation','are you free for a quick',
    'are you busy now','are you interested in','are you open to','would you be open',
    'reaching out','touching base','follow up','appreciation program','support team',
    'current issues in california','share your opinion'];
  const DELIV=['receipt from','view your receipt','your receipt','order confirmed','order is ready',
    'your order','payment received','payment confirmed','your appt','your appointment','appointment is',
    'scheduled for','confirm:','cancel:','reschedule:','is tomorrow','rsvp',
    'your ride','your driver','trip with','arriving now','license plate','car details','your lugg',
    'reservation at','booking confirmed','book a reservation',
    'your bill','bill is due','payment due','autopay','account ending in',
    'verification code','login code','security code','one-time code','one-time password',
    'use code:','your code is','your code:','authorize a login','clover.com','square.com','toast tab'];
  S.conversations.forEach(c=>{
    const uncategorizedEligible=c.category==='uncategorized'&&!c.contact_name&&!hasManualOverride(c);
    const personalRecheck=isEligiblePersonalRecheck(c);
    if(!uncategorizedEligible&&!personalRecheck)return;
    const t=(c.messages||[]).map(m=>(m.text||'').toLowerCase()).join(' ');
    if(personalRecheck){
      if(isHighConfidenceRideshare(t))c.category='delivery';
      return;
    }
    const ph=(c.phone||'').replace(/[\+\-\s]/g,'');
    if((ph.length<=6&&ph.length>0)||(c.phone||'').includes('@')){
      c.category=DELIV.some(k=>t.includes(k))?'delivery':'spam';return;}
    if(SPAM.some(k=>t.includes(k))){c.category='spam';return;}
    if(DELIV.some(k=>t.includes(k))){c.category='delivery';return;}
  });
}

function getCategory(c){
  // Phone-keyed override persists across re-exports
  if(c.phone&&S.overrides[c.phone])return S.overrides[c.phone];
  if(S.overrides[c.id])return S.overrides[c.id];
  const raw=c.category||'uncategorized';
  if(c.contact_name&&(raw==='delivery'||raw==='spam'))return'personal';
  return raw;
}

function normalizeIdentityToken(value){
  return String(value||'').trim().toLowerCase();
}

function normalizeHandleValue(value){
  const raw=String(value||'').trim().toLowerCase();
  if(!raw)return'';
  if(raw.includes('@'))return raw;
  return raw.replace(/[^0-9]/g,'');
}

function participantDismissKey(c){
  if(!c)return'';
  if(c.is_group){
    const groupName=normalizeIdentityToken(c.group_name);
    const handle=normalizeHandleValue(c.phone);
    if(groupName||handle)return`g:${groupName}|${handle}`;
    return`g:id:${normalizeIdentityToken(c.id)}`;
  }
  const handle=normalizeHandleValue(c.phone);
  if(handle)return`p:${handle}`;
  const contact=normalizeIdentityToken(c.contact_name);
  if(contact)return`p:name:${contact}`;
  return`p:id:${normalizeIdentityToken(c.id)}`;
}

function isRealTextMessageContent(text){
  const t=String(text||'').trim();
  if(!t)return false;
  if(t==='📎 Attachment')return false;
  return true;
}

function latestInboundTextAt(c){
  // Prefer the export-computed field, which covers the full message history
  // rather than just the 5-message preview stored in c.messages.
  if(c?.latest_inbound_at){
    const d=new Date(c.latest_inbound_at);
    if(!Number.isNaN(d.getTime()))return d.toISOString();
  }
  // Fallback: scan the 5-message preview (older exports without latest_inbound_at).
  const inbound=(c?.messages||[])
    .filter(m=>!m?.from_me&&isRealTextMessageContent(m?.text))
    .map(m=>m?.date)
    .map(d=>new Date(d))
    .filter(d=>!Number.isNaN(d.getTime()));
  if(!inbound.length)return null;
  return new Date(Math.max(...inbound.map(d=>d.getTime()))).toISOString();
}

function makeDismissRecord(c){
  return {
    key:participantDismissKey(c),
    dismissedAt:new Date().toISOString(),
    inboundCheckpointAt:latestInboundTextAt(c)||null,
    threadId:c?.id||''
  };
}

function saveDismissed(){
  try{localStorage.setItem(DISMISS_KEY,JSON.stringify(S.dismissed));}catch(_){}
}

function hasNewInboundSinceCheckpoint(c,rec){
  const nowInbound=latestInboundTextAt(c);
  if(!nowInbound)return false;
  if(!rec?.inboundCheckpointAt){
    // Legacy dismiss records may not have inboundCheckpointAt.
    // Fall back to dismissedAt so ignored threads don't auto-reappear on every load.
    const dismissedTs=new Date(rec?.dismissedAt||'').getTime();
    const nowTs=new Date(nowInbound).getTime();
    if(Number.isNaN(nowTs)||Number.isNaN(dismissedTs))return false;
    return nowTs>dismissedTs;
  }
  const nowTs=new Date(nowInbound).getTime();
  const checkpointTs=new Date(rec.inboundCheckpointAt).getTime();
  if(Number.isNaN(nowTs)||Number.isNaN(checkpointTs))return false;
  return nowTs>checkpointTs;
}

function getDismissRecord(c){
  if(!c)return null;
  const key=participantDismissKey(c);
  if(key&&S.dismissed[key]&&typeof S.dismissed[key]==='object')return S.dismissed[key];
  if(S.dismissed[c.id]===true||typeof S.dismissed[c.id]==='object'){
    const rec=makeDismissRecord(c);
    if(S.dismissed[c.id]&&typeof S.dismissed[c.id]==='object'){
      const old=S.dismissed[c.id];
      rec.dismissedAt=old.dismissedAt||rec.dismissedAt;
      rec.inboundCheckpointAt=old.inboundCheckpointAt||rec.inboundCheckpointAt;
    }
    if(key)S.dismissed[key]=rec;
    delete S.dismissed[c.id];
    saveDismissed();
    return rec;
  }
  return null;
}

function isDismissed(c){
  const rec=getDismissRecord(c);
  if(!rec)return false;
  if(hasNewInboundSinceCheckpoint(c,rec)){
    const key=participantDismissKey(c);
    if(key)delete S.dismissed[key];
    saveDismissed();
    return false;
  }
  return true;
}

function reconcileDismissedState(){
  let changed=false;
  S.conversations.forEach(c=>{
    const rec=getDismissRecord(c);
    if(!rec)return;
    if(hasNewInboundSinceCheckpoint(c,rec)){
      const key=participantDismissKey(c);
      if(key&&S.dismissed[key]){
        delete S.dismissed[key];
        changed=true;
      }
    }
  });
  if(changed)saveDismissed();
}

// ── Core filters ─────────────────────────────────────────────────────────────
function needsResponse(c){
  const cat=getCategory(c);
  if(cat==='spam'||cat==='delivery')return false;
  if(c.is_group)return false;
  if(c.i_replied_last)return false;
  if(isDismissed(c))return false;
  return true;
}
function inTimeline(c){
  const{timelineAfter,timelineBefore}=S.filter;
  if(!c.last_message_at)return false;
  const d=new Date(c.last_message_at);
  if(timelineAfter&&d<timelineAfter)return false;
  if(timelineBefore&&d>timelineBefore)return false;
  return true;
}
function actionable(){return S.conversations.filter(c=>needsResponse(c)&&inTimeline(c)&&c.contact_name);}
function allPersonalInTimeline(){return S.conversations.filter(c=>{
  const cat=getCategory(c);if(cat==='spam'||cat==='delivery')return false;
  if(c.is_group)return false;return inTimeline(c);});}
function allPersonalInTrailingDays(days){
  const cutoff=new Date();
  cutoff.setDate(cutoff.getDate()-days);
  cutoff.setHours(0,0,0,0);
  return S.conversations.filter(c=>{
    const cat=getCategory(c);if(cat==='spam'||cat==='delivery')return false;
    if(c.is_group)return false;
    if(!c.last_message_at)return false;
    return new Date(c.last_message_at)>=cutoff;
  });
}

// ── Score ─────────────────────────────────────────────────────────────────────
function computeScoreFromPersonal(personal){
  if(!personal.length)return{score:100,rate:100,speed:0,speedScore:100,hanging:0,hangingScore:100,replied:0,total:0};
  const replied=personal.filter(c=>c.i_replied_last||isDismissed(c));
  const unreplied=personal.filter(c=>!c.i_replied_last&&!isDismissed(c));
  const total=personal.length;
  const rate=Math.round((replied.length/total)*100);
  let avgWait=0;
  if(unreplied.length){avgWait=unreplied.reduce((s,c)=>{
    if(!c.last_message_at)return s;return s+(Date.now()-new Date(c.last_message_at).getTime())/3600000;},0)/unreplied.length;}
  let speedScore=100;if(avgWait>1)speedScore=Math.max(0,Math.round(100-(avgWait/72)*100));
  let hp=0;unreplied.forEach(c=>{if(!c.last_message_at)return;
    const h=(Date.now()-new Date(c.last_message_at).getTime())/3600000;
    if(h<1)hp+=1;else if(h<24)hp+=3;else if(h<72)hp+=6;else hp+=10;});
  const hangingScore=Math.max(0,100-hp);
  const score=Math.round(rate*0.45+speedScore*0.25+hangingScore*0.30);
  return{score:Math.max(0,Math.min(100,score)),rate,speed:avgWait,speedScore,hanging:unreplied.length,hangingScore,replied:replied.length,total};
}
function computeScore(){return computeScoreFromPersonal(allPersonalInTimeline());}
function computeFixedHistoryScore(){return computeScoreFromPersonal(allPersonalInTrailingDays(7));}
function scoreColor(s){if(s>=85)return'var(--green)';if(s>=65)return'var(--yellow)';if(s>=40)return'var(--orange)';return'var(--red)';}
function fmtSpeed(h){if(h<1)return'<1h';return Math.round(h)+'h';}
function scoreLabel(score){
  if(score<=15)return'actively ghosting 👻';
  if(score<=35)return'bad texter 😬';
  if(score<=55)return'hit or miss 🎲';
  if(score<=75)return'solid 👍';
  if(score<=90)return'on it ⚡️';
  return'ELITE responder 🏆';
}
function cleanScoreLabel(label){
  return String(label||'').replace(/\s*\(\d+\)\s*$/,'').trim();
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function waitHours(c){if(!c.last_message_at)return 0;return(Date.now()-new Date(c.last_message_at).getTime())/3600000;}
function urgency(c){const h=waitHours(c);if(h<1)return'green';if(h<24)return'yellow';if(h<72)return'orange';return'red';}
function relTime(d){if(!d)return'';const ms=Date.now()-new Date(d).getTime(),m=Math.floor(ms/60000),h=Math.floor(ms/3600000),dy=Math.floor(ms/86400000);
  if(m<1)return'now';if(m<60)return m+'m';if(h<24)return h+'h';if(dy<7)return dy+'d';
  return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fullTime(d){if(!d)return'';return new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function displayName(c){if(c.is_group&&c.group_name&&c.group_name.trim())return c.group_name.trim();return c.contact_name||c.phone||'Unknown';}
function initial(c){return displayName(c).trim()[0].toUpperCase();}
function latestEventAt(c){return c.last_message_at||null;}
function latestEventText(c){return c.last_message_text||'';}
function literalRecentEvents(c){return(c.messages||[]).slice(-5);}
function previewTextIncluded(txt){
  if(!txt)return false;
  if(!PREVIEW_INCLUDE_ATTACHMENT&&txt==='📎 Attachment')return false;
  return true;
}
function previewRows(c){
  return (c.messages||[])
    .filter(m=>previewTextIncluded(String(m?.text??'').trim()))
    .slice(-2)
    .map(m=>({
      from_me:!!m.from_me,
      text:String(m.text).trim()
    }));
}


function getReplyAssistState(threadId){
  if(!S.replyAssistById[threadId]){
    S.replyAssistById[threadId]={
      isGenerating:false,
      suggestedReply:'',
      generationAttempted:false,
      blockedReason:'',
      copied:false,
      regenerateCount:0
    };
  }
  return S.replyAssistById[threadId];
}

function isPlainTextMessage(msg){
  const text=String(msg?.text??'').trim();
  if(!text)return false;
  return text!=='📎 Attachment';
}

function latestVisibleTextMessage(thread){
  const msgs=Array.isArray(thread?.messages)?thread.messages:[];
  for(let i=msgs.length-1;i>=0;i--){
    if(isPlainTextMessage(msgs[i])) return msgs[i];
  }
  return null;
}

function isAiThreadAllowlisted(thread){
  return !!thread&&AI_ALLOWED_DEMO_THREAD_IDS.has(String(thread.id||''));
}

function aiReplyBlockReason(thread){
  if(!isAiThreadAllowlisted(thread))return 'Not on demo allowlist';
  const lastVisible=latestVisibleTextMessage(thread);
  if(!lastVisible)return 'Need an incoming text to reply to';
  if(lastVisible.from_me)return 'Need an incoming text to reply to';
  return '';
}

function isAiReplyAllowed(thread){
  return aiReplyBlockReason(thread)==='';
}

function buildReplyContext(thread){
  const msgs=(thread?.messages||[])
    .filter(m=>isPlainTextMessage(m))
    .map(m=>({
      speaker:m?.from_me?'Me':'Them',
      text:String(m?.text??'').trim()
    }))
    .filter(m=>m.text.length>0);

  return msgs.slice(-6);
}

function getAiEndpoint(){
  return AI_SUGGEST_ROUTE;
}

function buildAiPrompt(context, latestInbound){
  const conversation=context.map(m=>`${m.speaker}: ${m.text}`).join('\n');
  return `Write exactly one short text reply to the latest inbound message.

Examples of good replies:

Input: “I saw you across the street and you did not acknowledge me. Don’t act like you were looking at a bird.”
Reply: “no fake bird, just poor situational awareness on my end”

Input: “Need yes/no. Is this outfit saying ‘charity lunch’ or ‘minor European princess’?”
Reply: “minor european princess, but like approachable”

Input: “I have an idea. It’s about longing.”
Reply: “no idea what that means, which is probably the problem”

Input: “I couldn’t help but wonder: is replying late a red flag or a branding exercise?”
Reply: “branding exercise, obviously”

Input: “Hypothetically, how bad is it to ignore a parking ticket for emotional reasons?”
Reply: “emotionally valid, financially inadvisable”

Input: “We gotta discuss dinner. Nobody knows where to eat anymore. Society’s collapsing.”
Reply: “agreed, we’ve lost the plot. where are we going?”

Input: “Here’s the phrase: ‘Hyperlocal media disruption engine.’ Too small?”
Reply: “that’s either a poem or a problem”

Constraints:
- write it like a normal text message
- respond directly to the latest messages
- avoid overly polished or formal phrasing
- do not use em dashes
- be witty and funny

Latest inbound message:
${latestInbound}

Recent text context:
${conversation}`;
}

async function requestSuggestedReplyFromModel(thread, context){
  const latest=context[context.length-1];
  if(!latest||latest.speaker!=='Them') throw new Error('Latest message is not inbound text');
  const response=await fetch(getAiEndpoint(),{
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({
      model:DEFAULT_AI_MODEL,
      prompt:buildAiPrompt(context,latest.text),
      latestInbound:latest.text,
      context
    })
  });

  if(!response.ok){
    const raw=await response.text().catch(()=> '');
    throw new Error(`AI request failed (${response.status}): ${raw.slice(0,200)}`);
  }

  const data=await response.json();
  const reply=String(data?.reply||'').trim();
  if(!reply)throw new Error('AI returned empty reply');
  return reply;
}

function containsBannedPreamble(text){
  return /(here'?s\s+(a\s+)?reply|you\s+could\s+say|response\s+you\s+could\s+send|i\s+hope\s+you'?re\s+doing\s+well|thank\s+you\s+for\s+reaching\s+out|i\s+apologize\s+for\s+the\s+delay)/i.test(text);
}

function hasGreetingOrSignoff(text){
  return /(^|\s)(hi|hello|hey|dear)\b|\b(best|sincerely|regards|thanks[,!]?|thank you[,!]?|cheers)\s*$|\bthanks for\b/i.test(text);
}

function looksAssistantLike(text){
  return /(absolutely|certainly|let me know|happy to help|as an ai|please feel free|that sounds great!?$)/i.test(text);
}

function validateAiReply(output, thread){
  const text=String(output||'').trim();
  if(!text)return { valid:false, reason:'empty' };
  const words=text.split(/\s+/).filter(Boolean);
  if(words.length<2)return { valid:false, reason:'near-empty' };
  if(words.length>20)return { valid:false, reason:'too-long' };
  if(text.includes('—'))return { valid:false, reason:'em-dash' };
  if(/["“”]/.test(text))return { valid:false, reason:'quotes' };
  if(containsBannedPreamble(text))return { valid:false, reason:'preamble' };
  if(hasGreetingOrSignoff(text))return { valid:false, reason:'greeting-signoff' };
  if(looksAssistantLike(text))return { valid:false, reason:'assistant-tone' };
  if(/[\n•]|\boption\s*1\b|\bor\s+\w+\s*\?/i.test(text))return { valid:false, reason:'multiple-options' };
  const inbound=buildReplyContext(thread).slice(-1)[0]?.text?.toLowerCase()||'';
  if(inbound){
    const inboundTerms=inbound.split(/[^a-z0-9']+/i).filter(w=>w.length>=4).slice(0,8);
    const out=text.toLowerCase();
    const overlap=inboundTerms.some(t=>out.includes(t));
    if(!overlap&&words.length>=10)return { valid:false, reason:'may-not-respond' };
  }
  return { valid:true, reason:'ok' };
}

async function generateAiReply(thread){
  const context=buildReplyContext(thread);
  if(!context.length)return { ok:false, reason:'no-context' };
  const latest=context[context.length-1];
  if(latest.speaker!=='Them')return { ok:false, reason:'latest-not-inbound' };
  const candidate=await requestSuggestedReplyFromModel(thread,context);
  const check=validateAiReply(candidate,thread);
  if(!check.valid)return { ok:false, reason:check.reason };
  return { ok:true, reply:candidate };
}

  if(!isAiThreadAllowlisted(thread))return '';

  const st=getReplyAssistState(thread.id);
  const triggerHtml=`<div class="ai-trigger-row"><button class="btn-dismiss" onclick="generateReplyForThread(${esc(JSON.stringify(thread.id))},false);event.stopPropagation()">AI Suggested Reply</button></div>`;

  if(st.isGenerating){
    return `${triggerHtml}<div class="ai-use-note">Generating...</div>`;
  }

  if(st.suggestedReply){
    return `
      ${triggerHtml}
      <div class="ai-suggest-card">

        <div class="ai-suggest-text">${esc(st.suggestedReply)}</div>

          <span class="ai-use-note">${st.copied?'Added to draft':''}</span>

        <div class="ai-suggest-text">Can't generate a reply for this message</div>
        <div class="ai-use-note">${esc(st.blockedReason)}</div>
      </div>
    `;
  }

  return triggerHtml;
}
